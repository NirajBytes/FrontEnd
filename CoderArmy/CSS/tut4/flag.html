<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .container{
            height: 600px;
            width: 900px;
            background-color: yellow;
            display: flex;
            flex-direction: column;
            gap: 10%;
        }
        .box{
            background-color: blue;
        }
     
        .strip1{
            height: 45%;
            width: 45%;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box strip1"></div>
        <div class="box strip2"></div>
        <div class="box strip3"></div>
        <div class="box strip4"></div>
    </div>
    
</body>
</html>
