<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: center;
        }
        #container{
            height: 450px;
            width: 400px;
            border: 1px solid;
            background-color: pink;
        }
        h1{
            text-align: center;
            margin: 10px;
            padding: 5px;
        }
        label{
            margin: 5px;
        }
    </style>
</head>
<body>
   <div id="container">
    <form action="">
        <h1>Signup Form</h1>
        <label for="name" style="display: block;">Username :</label>
        <input type="text" placeholder="Enter Username" id="name" name="name">
         <label for="mail" style="display: block;">Email :</label>
        <input type="email" placeholder="Enter Email" id="mail" name="mail">
         <label for="password" style="display: block;">Password :</label>
        <input type="password" placeholder="Enter password" id="password" name="password">
    </form>
   </div>
</body>
</html>
